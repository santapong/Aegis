services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: money_management
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Steady-state probes every 10s; start_interval keeps `depends_on:
    # service_healthy` gating fast during boot (Docker Engine 25+).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d money_management"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 2s
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/money_management
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:3000","http://frontend:3000","https://localhost"]'}
      # This compose file always starts the redis service, so default the
      # backend at it — shared cache + rate limiter across the uvicorn
      # workers instead of one in-memory copy per worker. Override via .env.
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The probe spawns a Python interpreter and runs a DB-backed HTTP
    # request — 30s steady-state is plenty; start_interval keeps the
    # frontend's service_healthy gate fast during boot (Engine 25+).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/api/health', timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 3s
    deploy:
      resources:
        limits:
          memory: 512M

  # Redis sidecar for cache + rate limiter + background-job queue.
  # The backend and worker are wired at it by default above; outside
  # compose the app silently falls back to in-memory cache + inline
  # PDF rendering unless CACHE_BACKEND/CACHE_REDIS_URL are set.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Bound memory below the container limit. volatile-lru evicts only
    # keys WITH a TTL — cache entries (always TTL'd) can be evicted
    # under pressure while arq queue/job keys (no TTL) are never
    # dropped. Don't switch to allkeys-* while the queue shares this
    # instance.
    command: redis-server --maxmemory 96mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 128M

  # Background worker — picks up jobs enqueued via app/jobs.py. Today
  # that's PDF rendering; the design doc at
  # docs/design/001-background-worker-queue.md covers Phase 2.
  # Lifts WeasyPrint + matplotlib off the API workers so a concurrent
  # PDF + AI request doesn't starve /api/health.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/money_management
      CACHE_BACKEND: redis
      CACHE_REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the standalone build's rewrite config (rewrites()
        # is evaluated at build time with output:standalone). Same-origin
        # /api/* in the browser, proxied server-side to the backend
        # container — works from any device that can reach :3000.
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
