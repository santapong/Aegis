name: deploy-vercel

# Manual fallback for the linked full-app Services project. Native Git
# integration deploys main. Required secrets: VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID. Application settings stay in Vercel.

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy to production"
        type: boolean
        default: false

# Cancel a prior in-flight deploy of the same branch so we don't
# end up with two parallel Vercel builds racing each other.
concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy Aegis services
    runs-on: ubuntu-latest
    env:
      VERCEL_CLI_VERSION: "65.2.0"
    # GitHub Environments give us per-deploy approval gates + a place
    # to scope secrets. Create `production` and `preview` environments
    # in repo Settings → Environments and attach VERCEL_* secrets there
    # if you want stricter separation; falls back to repo secrets.
    environment:
      name: ${{ inputs.production && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      # No `cache:` here — the repo uses bun.lock (setup-node's npm cache
      # needs a package-lock.json and fails the job without one), and this
      # job only installs the Vercel CLI; the app build runs on Vercel.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Vercel CLI
        run: npm install -g "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel environment
        # Pull the project metadata + the matching env-var set. Use the
        # production env only when explicitly selected.
        working-directory: .
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ "${{ inputs.production }}" == "true" ]]; then
            vercel pull --yes --environment=production
          else
            vercel pull --yes --environment=preview
          fi

      - name: Build
        working-directory: .
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          if [[ "${{ inputs.production }}" == "true" ]]; then
            vercel build --prod
          else
            vercel build
          fi

      - name: Deploy
        id: deploy
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ "${{ inputs.production }}" == "true" ]]; then
            url=$(vercel deploy --prebuilt --prod)
          else
            url=$(vercel deploy --prebuilt)
          fi
          echo "Deployed → $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test public production alias
        if: inputs.production
        # Verify the API through the full-app production routing.
        run: |
          url="https://aegis-eight-azure.vercel.app"
          echo "Smoking $url/api/health"
          for i in 1 2 3 4 5; do
            response=$(curl -fsS --max-time 10 "$url/api/health" || true)
            if EXPECTED_VERSION="$(node -p "require('./frontend/package.json').version")" HEALTH_BODY="$response" node -e 'const h=JSON.parse(process.env.HEALTH_BODY||"{}");process.exit(h.status==="ok"&&h.version===process.env.EXPECTED_VERSION?0:1)'; then
              echo "Health check passed: $response"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "Health check never returned status=ok. Backend not reachable through the rewrite."
          exit 1
