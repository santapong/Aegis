<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Aegis backend — request path components (C4 Level 3)</title>
  <desc id="d">A request enters through the middleware stack, is dispatched to a domain router, which resolves dependencies and calls the service layer; the service layer reaches the database through SQLAlchemy and Redis directly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a7488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="960" fill="#050810"/>
  <text x="40" y="52" fill="#e5ecf5" font-size="22" font-weight="bold">Aegis backend — the request path</text>
  <text x="40" y="76" fill="#8499b3" font-size="13">C4 Level 3 · read top to bottom; that is the order a request actually travels</text>

  <rect x="240" y="280" width="640" height="650" rx="14" fill="none" stroke="#5ad8ff" stroke-width="1.6" stroke-dasharray="8 6" opacity="0.55"/>
  <text x="256" y="304" fill="#5ad8ff" font-size="12.5" opacity="0.85">Backend API — FastAPI [container boundary]</text>

  <!-- Frontend (external to this container) -->
  <g>
    <rect x="290" y="160" width="520" height="90" rx="10" fill="#0e1422" stroke="#6a7488" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="550" y="196" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Frontend</text>
    <text x="550" y="217" fill="#8499b3" font-size="12" text-anchor="middle">[Container · Next.js 15]</text>
    <text x="550" y="238" fill="#8499b3" font-size="12.5" text-anchor="middle">Proxies /api/* server-side.</text>
  </g>

  <!-- Middleware -->
  <g>
    <rect x="290" y="330" width="520" height="120" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="550" y="366" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Middleware stack</text>
    <text x="550" y="387" fill="#8499b3" font-size="12" text-anchor="middle">[Component · Starlette middleware]</text>
    <text x="550" y="411" fill="#8499b3" font-size="12.5" text-anchor="middle">RequestID · CORS · GZip (500 B) · BodySize (2 MB)</text>
    <text x="550" y="428" fill="#8499b3" font-size="12.5" text-anchor="middle">RateLimit · SecurityHeaders (CSP + HSTS)</text>
    <text x="550" y="445" fill="#5ad8ff" font-size="12" text-anchor="middle">Listed outermost first — the order is the contract.</text>
  </g>

  <!-- Routers -->
  <g>
    <rect x="290" y="490" width="520" height="110" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="550" y="526" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Domain routers</text>
    <text x="550" y="547" fill="#8499b3" font-size="12" text-anchor="middle">[Component · FastAPI APIRouter]</text>
    <text x="550" y="571" fill="#8499b3" font-size="12.5" text-anchor="middle">transactions · budgets · plans · payments · ai</text>
    <text x="550" y="588" fill="#8499b3" font-size="12.5" text-anchor="middle">reports · trips · market · jobs</text>
  </g>

  <!-- Dependencies -->
  <g>
    <rect x="290" y="650" width="240" height="110" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="410" y="686" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Dependencies</text>
    <text x="410" y="707" fill="#8499b3" font-size="12" text-anchor="middle">[Component · Depends]</text>
    <text x="410" y="731" fill="#8499b3" font-size="12.5" text-anchor="middle">get_db · get_cache</text>
    <text x="410" y="748" fill="#8499b3" font-size="12.5" text-anchor="middle">get_current_user</text>
  </g>

  <!-- Services -->
  <g>
    <rect x="570" y="650" width="240" height="110" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="690" y="686" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Service layer</text>
    <text x="690" y="707" fill="#8499b3" font-size="12" text-anchor="middle">[Component · Python]</text>
    <text x="690" y="731" fill="#8499b3" font-size="12.5" text-anchor="middle">ai_engine · notification</text>
    <text x="690" y="748" fill="#8499b3" font-size="12.5" text-anchor="middle">pdf_renderer · recurrence</text>
  </g>

  <!-- ORM -->
  <g>
    <rect x="570" y="810" width="240" height="100" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="690" y="846" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">ORM</text>
    <text x="690" y="867" fill="#8499b3" font-size="12" text-anchor="middle">[Component · SQLAlchemy 2.0]</text>
    <text x="690" y="891" fill="#8499b3" font-size="12.5" text-anchor="middle">One session per request.</text>
  </g>

  <!-- Redis -->
  <g>
    <rect x="920" y="650" width="230" height="110" rx="10" fill="#0e1422" stroke="#59d6a3" stroke-width="2"/>
    <text x="1035" y="686" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Redis</text>
    <text x="1035" y="707" fill="#8499b3" font-size="12" text-anchor="middle">[Datastore]</text>
    <text x="1035" y="731" fill="#8499b3" font-size="12.5" text-anchor="middle">Cache · rate limiter.</text>
  </g>

  <!-- Database -->
  <g>
    <rect x="920" y="810" width="230" height="100" rx="10" fill="#0e1422" stroke="#59d6a3" stroke-width="2.5"/>
    <text x="1035" y="846" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Database</text>
    <text x="1035" y="867" fill="#8499b3" font-size="12" text-anchor="middle">[Datastore]</text>
    <text x="1035" y="891" fill="#8499b3" font-size="12.5" text-anchor="middle">SQLite · Postgres · MySQL.</text>
  </g>

  <!-- Edges -->
  <line x1="550" y1="250" x2="550" y2="324" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="560" y="292" fill="#b6c2d2" font-size="12">/api/*</text>

  <line x1="550" y1="450" x2="550" y2="484" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="560" y="472" fill="#b6c2d2" font-size="12">dispatch</text>

  <line x1="480" y1="600" x2="420" y2="644" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="432" y="624" fill="#b6c2d2" font-size="12" text-anchor="end">resolve</text>

  <line x1="620" y1="600" x2="680" y2="644" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="668" y="624" fill="#b6c2d2" font-size="12">call</text>

  <line x1="690" y1="760" x2="690" y2="804" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="700" y="787" fill="#b6c2d2" font-size="12">use</text>

  <line x1="810" y1="700" x2="914" y2="700" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="816" y="690" fill="#b6c2d2" font-size="12">get / set</text>

  <line x1="810" y1="860" x2="914" y2="860" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="816" y="850" fill="#b6c2d2" font-size="12">SQL</text>
</svg>
