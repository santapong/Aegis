<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 790" width="1300" height="790" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Aegis — container view (C4 Level 2)</title>
  <desc id="d">Two services, one database and an optional Redis inside the Aegis boundary, plus a background worker. Stripe and the LLM providers sit outside it and are reached only by the back end.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a7488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="790" fill="#050810"/>
  <text x="40" y="52" fill="#e5ecf5" font-size="22" font-weight="bold">Aegis — containers</text>
  <text x="40" y="76" fill="#8499b3" font-size="13">C4 Level 2 · what runs, and what each piece is allowed to talk to</text>

  <rect x="240" y="150" width="700" height="560" rx="14" fill="none" stroke="#5ad8ff" stroke-width="1.6" stroke-dasharray="8 6" opacity="0.55"/>
  <text x="256" y="174" fill="#5ad8ff" font-size="12.5" opacity="0.85">Aegis [system boundary]</text>

  <g>
    <rect x="40" y="200" width="150" height="110" rx="10" fill="#0e1422" stroke="#8aa6c4" stroke-width="2"/>
    <text x="115" y="240" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">User</text>
    <text x="115" y="261" fill="#8499b3" font-size="12" text-anchor="middle">[Person]</text>
    <text x="115" y="285" fill="#8499b3" font-size="12.5" text-anchor="middle">Manages personal</text>
    <text x="115" y="302" fill="#8499b3" font-size="12.5" text-anchor="middle">finances.</text>
  </g>

  <g>
    <rect x="290" y="200" width="600" height="110" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="590" y="238" fill="#e5ecf5" font-size="17" font-weight="bold" text-anchor="middle">Frontend</text>
    <text x="590" y="259" fill="#8499b3" font-size="12" text-anchor="middle">[Container · Next.js 15 · React 19]</text>
    <text x="590" y="283" fill="#8499b3" font-size="12.5" text-anchor="middle">App Router pages · Zustand stores · React Query v5</text>
    <text x="590" y="301" fill="#5ad8ff" font-size="12.5" text-anchor="middle">The /api/* rewrite proxy keeps auth same-origin — no CORS preflight, no browser-side backend URL.</text>
  </g>

  <g>
    <rect x="290" y="360" width="600" height="130" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2.5"/>
    <text x="590" y="398" fill="#e5ecf5" font-size="17" font-weight="bold" text-anchor="middle">Backend API</text>
    <text x="590" y="419" fill="#8499b3" font-size="12" text-anchor="middle">[Container · FastAPI · Python 3.11+]</text>
    <text x="590" y="444" fill="#8499b3" font-size="12.5" text-anchor="middle">Middleware stack · domain routers · service layer · SQLAlchemy 2.0</text>
    <text x="590" y="468" fill="#5ad8ff" font-size="12.5" text-anchor="middle">Every external credential lives here and nowhere else.</text>
  </g>

  <g>
    <rect x="270" y="550" width="180" height="130" rx="10" fill="#0e1422" stroke="#59d6a3" stroke-width="2.5"/>
    <text x="360" y="588" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Database</text>
    <text x="360" y="609" fill="#8499b3" font-size="12" text-anchor="middle">[Datastore]</text>
    <text x="360" y="633" fill="#8499b3" font-size="12.5" text-anchor="middle">Domain data. SQLite,</text>
    <text x="360" y="650" fill="#8499b3" font-size="12.5" text-anchor="middle">Postgres or MySQL via</text>
    <text x="360" y="667" fill="#8499b3" font-size="12.5" text-anchor="middle">DATABASE_URL.</text>
  </g>

  <g>
    <rect x="505" y="550" width="180" height="130" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="595" y="588" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Worker</text>
    <text x="595" y="609" fill="#8499b3" font-size="12" text-anchor="middle">[Container · arq]</text>
    <text x="595" y="633" fill="#8499b3" font-size="12.5" text-anchor="middle">Background jobs.</text>
    <text x="595" y="650" fill="#8499b3" font-size="12.5" text-anchor="middle">Optional — the API</text>
    <text x="595" y="667" fill="#8499b3" font-size="12.5" text-anchor="middle">runs without it.</text>
  </g>

  <g>
    <rect x="740" y="550" width="180" height="130" rx="10" fill="#0e1422" stroke="#59d6a3" stroke-width="2"/>
    <text x="830" y="588" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Redis</text>
    <text x="830" y="609" fill="#8499b3" font-size="12" text-anchor="middle">[Datastore]</text>
    <text x="830" y="633" fill="#8499b3" font-size="12.5" text-anchor="middle">Cache · rate limiter ·</text>
    <text x="830" y="650" fill="#8499b3" font-size="12.5" text-anchor="middle">arq queue. Falls back</text>
    <text x="830" y="667" fill="#8499b3" font-size="12.5" text-anchor="middle">to in-memory.</text>
  </g>

  <g>
    <rect x="1030" y="360" width="230" height="110" rx="10" fill="#0e1422" stroke="#6a7488" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="1145" y="398" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">LLM providers</text>
    <text x="1145" y="419" fill="#8499b3" font-size="12" text-anchor="middle">[External system]</text>
    <text x="1145" y="443" fill="#8499b3" font-size="12.5" text-anchor="middle">Anthropic · Typhoon · Groq.</text>
  </g>

  <g>
    <rect x="1030" y="520" width="230" height="110" rx="10" fill="#0e1422" stroke="#6a7488" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="1145" y="558" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Stripe</text>
    <text x="1145" y="579" fill="#8499b3" font-size="12" text-anchor="middle">[External system]</text>
    <text x="1145" y="603" fill="#8499b3" font-size="12.5" text-anchor="middle">Checkout + webhooks,</text>
    <text x="1145" y="620" fill="#8499b3" font-size="12.5" text-anchor="middle">test mode.</text>
  </g>

  <line x1="190" y1="255" x2="284" y2="255" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="237" y="245" fill="#b6c2d2" font-size="12" text-anchor="middle">HTTPS</text>

  <line x1="590" y1="310" x2="590" y2="354" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="600" y="337" fill="#b6c2d2" font-size="12">REST /api/*</text>

  <line x1="430" y1="490" x2="374" y2="544" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="392" y="522" fill="#b6c2d2" font-size="12" text-anchor="end">SQL</text>

  <line x1="595" y1="490" x2="595" y2="544" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="605" y="522" fill="#b6c2d2" font-size="12">enqueue</text>

  <line x1="760" y1="490" x2="816" y2="544" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="798" y="522" fill="#b6c2d2" font-size="12">cache</text>

  <line x1="499" y1="615" x2="456" y2="615" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="477" y="605" fill="#b6c2d2" font-size="12" text-anchor="middle">SQL</text>

  <line x1="691" y1="615" x2="734" y2="615" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="712" y="605" fill="#b6c2d2" font-size="11.5" text-anchor="middle">dequeue</text>

  <line x1="890" y1="405" x2="1024" y2="405" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="952" y="395" fill="#b6c2d2" font-size="12">tool_use</text>

  <line x1="890" y1="455" x2="1024" y2="552" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="952" y="512" fill="#b6c2d2" font-size="12">webhooks</text>
</svg>
