<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 730" width="1340" height="730" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Analytics replication — CDC pipeline (C4 Level 2, Containers)</title>
  <desc id="d">Change-data-capture replicates the operational database into a warehouse, so BI tools query the warehouse and never the OLTP store the product depends on.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a7488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1340" height="730" fill="#050810"/>
  <text x="40" y="52" fill="#e5ecf5" font-size="22" font-weight="bold">Analytics replication — the CDC pipeline</text>
  <text x="40" y="76" fill="#8499b3" font-size="13">C4 Level 2 · analytics reads a replica, never the store serving live requests</text>

  <!-- Aegis boundary -->
  <rect x="250" y="200" width="380" height="420" rx="14" fill="none" stroke="#5ad8ff" stroke-width="1.6" stroke-dasharray="8 6" opacity="0.55"/>
  <text x="266" y="224" fill="#5ad8ff" font-size="12.5" opacity="0.85">Aegis [system boundary]</text>

  <!-- Analytics boundary -->
  <rect x="720" y="150" width="560" height="520" rx="14" fill="none" stroke="#8499b3" stroke-width="1.6" stroke-dasharray="8 6" opacity="0.5"/>
  <text x="736" y="174" fill="#8499b3" font-size="12.5">Analytics [system boundary · not ours]</text>

  <g>
    <rect x="40" y="255" width="150" height="110" rx="10" fill="#0e1422" stroke="#8aa6c4" stroke-width="2"/>
    <text x="115" y="295" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Users</text>
    <text x="115" y="316" fill="#8499b3" font-size="12" text-anchor="middle">[Person]</text>
    <text x="115" y="340" fill="#8499b3" font-size="12.5" text-anchor="middle">Live traffic.</text>
  </g>

  <g>
    <rect x="290" y="250" width="300" height="120" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2.5"/>
    <text x="440" y="290" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Aegis backend</text>
    <text x="440" y="311" fill="#8499b3" font-size="12" text-anchor="middle">[Container · FastAPI]</text>
    <text x="440" y="335" fill="#8499b3" font-size="12.5" text-anchor="middle">Serves the product. Never</text>
    <text x="440" y="352" fill="#8499b3" font-size="12.5" text-anchor="middle">queries the warehouse.</text>
  </g>

  <g>
    <rect x="290" y="450" width="300" height="120" rx="10" fill="#0e1422" stroke="#59d6a3" stroke-width="2.5"/>
    <text x="440" y="490" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Operational DB</text>
    <text x="440" y="511" fill="#8499b3" font-size="12" text-anchor="middle">[Datastore · Postgres · MySQL]</text>
    <text x="440" y="535" fill="#8499b3" font-size="12.5" text-anchor="middle">OLTP source of truth.</text>
    <text x="440" y="555" fill="#5ad8ff" font-size="12.5" text-anchor="middle">Protect its latency budget.</text>
  </g>

  <g>
    <rect x="760" y="200" width="480" height="120" rx="10" fill="#0e1422" stroke="#6a7488" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="1000" y="240" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">CDC pipeline</text>
    <text x="1000" y="261" fill="#8499b3" font-size="12" text-anchor="middle">[External system]</text>
    <text x="1000" y="285" fill="#8499b3" font-size="12.5" text-anchor="middle">Fivetran · Airbyte · Debezium · DMS · Datastream</text>
    <text x="1000" y="304" fill="#5ad8ff" font-size="12.5" text-anchor="middle">Replication lag is seconds to minutes — never read it as live.</text>
  </g>

  <g>
    <rect x="760" y="380" width="480" height="110" rx="10" fill="#0e1422" stroke="#6a7488" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="1000" y="418" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Warehouse</text>
    <text x="1000" y="439" fill="#8499b3" font-size="12" text-anchor="middle">[External datastore]</text>
    <text x="1000" y="463" fill="#8499b3" font-size="12.5" text-anchor="middle">Redshift · BigQuery · Snowflake · ClickHouse</text>
  </g>

  <g>
    <rect x="760" y="540" width="480" height="110" rx="10" fill="#0e1422" stroke="#6a7488" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="1000" y="578" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">BI tools</text>
    <text x="1000" y="599" fill="#8499b3" font-size="12" text-anchor="middle">[External system]</text>
    <text x="1000" y="623" fill="#8499b3" font-size="12.5" text-anchor="middle">Looker · Metabase · Superset · Tableau · Hex</text>
  </g>

  <line x1="190" y1="310" x2="284" y2="310" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="237" y="300" fill="#b6c2d2" font-size="12" text-anchor="middle">uses</text>

  <line x1="440" y1="370" x2="440" y2="444" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450" y="412" fill="#b6c2d2" font-size="12">SQL</text>

  <polyline points="590,510 700,510 700,250 754,250" fill="none" stroke="#6a7488" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="714" y="228" fill="#b6c2d2" font-size="12" text-anchor="end">WAL / binlog</text>

  <line x1="1000" y1="320" x2="1000" y2="374" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1010" y="352" fill="#b6c2d2" font-size="12">loads</text>

  <line x1="1000" y1="490" x2="1000" y2="534" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1010" y="517" fill="#b6c2d2" font-size="12">queries</text>
</svg>
