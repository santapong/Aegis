<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 340" width="1300" height="340" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Shared shape of every Aegis deploy recipe (C4 Level 2, Containers)</title>
  <desc id="d">Every deployment recipe reduces to the same chain: browser to front end over HTTPS, front end to back end through a server-side proxy, back end to Postgres.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a7488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="340" fill="#050810"/>
  <text x="40" y="52" fill="#e5ecf5" font-size="22" font-weight="bold">Every deploy recipe, same shape</text>
  <text x="40" y="76" fill="#8499b3" font-size="13">C4 Level 2 · the hosts differ; this chain does not</text>

  <g>
    <rect x="40" y="140" width="160" height="120" rx="10" fill="#0e1422" stroke="#8aa6c4" stroke-width="2"/>
    <text x="120" y="180" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">User</text>
    <text x="120" y="201" fill="#8499b3" font-size="12" text-anchor="middle">[Person]</text>
    <text x="120" y="225" fill="#8499b3" font-size="12.5" text-anchor="middle">Browser.</text>
  </g>

  <g>
    <rect x="290" y="140" width="270" height="120" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="425" y="180" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Frontend</text>
    <text x="425" y="201" fill="#8499b3" font-size="12" text-anchor="middle">[Container · Next.js]</text>
    <text x="425" y="225" fill="#8499b3" font-size="12.5" text-anchor="middle">Serves the app and proxies</text>
    <text x="425" y="242" fill="#8499b3" font-size="12.5" text-anchor="middle">/api/* server-side.</text>
  </g>

  <g>
    <rect x="650" y="140" width="270" height="120" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2.5"/>
    <text x="785" y="180" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Backend</text>
    <text x="785" y="201" fill="#8499b3" font-size="12" text-anchor="middle">[Container · FastAPI]</text>
    <text x="785" y="225" fill="#8499b3" font-size="12.5" text-anchor="middle">JWT auth · business logic</text>
    <text x="785" y="242" fill="#8499b3" font-size="12.5" text-anchor="middle">Stripe · Anthropic · WeasyPrint</text>
  </g>

  <g>
    <rect x="1010" y="140" width="250" height="120" rx="10" fill="#0e1422" stroke="#59d6a3" stroke-width="2.5"/>
    <text x="1135" y="180" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Postgres</text>
    <text x="1135" y="201" fill="#8499b3" font-size="12" text-anchor="middle">[Datastore]</text>
    <text x="1135" y="225" fill="#8499b3" font-size="12.5" text-anchor="middle">Managed or self-hosted.</text>
  </g>

  <line x1="200" y1="200" x2="284" y2="200" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="242" y="190" fill="#b6c2d2" font-size="12" text-anchor="middle">HTTPS</text>

  <line x1="560" y1="200" x2="644" y2="200" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="602" y="190" fill="#b6c2d2" font-size="12" text-anchor="middle">/api/*</text>

  <line x1="920" y1="200" x2="1004" y2="200" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="962" y="190" fill="#b6c2d2" font-size="12" text-anchor="middle">SQL</text>
</svg>
