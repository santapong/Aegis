<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Aegis — architecture snapshot (C4 Level 2, Containers)</title>
  <desc id="d">The shipped shape as of v1.3.0: one Next.js front end, one FastAPI back end, one database chosen by DATABASE_URL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a7488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#050810"/>
  <text x="40" y="52" fill="#e5ecf5" font-size="22" font-weight="bold">Aegis — architecture snapshot</text>
  <text x="40" y="76" fill="#8499b3" font-size="13">C4 Level 2 · what actually ships today, at v1.3.0</text>

  <rect x="200" y="140" width="600" height="560" rx="14" fill="none" stroke="#5ad8ff" stroke-width="1.6" stroke-dasharray="8 6" opacity="0.55"/>
  <text x="216" y="164" fill="#5ad8ff" font-size="12.5" opacity="0.85">Aegis [system boundary]</text>

  <g>
    <rect x="240" y="190" width="520" height="150" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="500" y="228" fill="#e5ecf5" font-size="17" font-weight="bold" text-anchor="middle">Frontend</text>
    <text x="500" y="249" fill="#8499b3" font-size="12" text-anchor="middle">[Container · Next.js 15 · React 19 · Bun]</text>
    <text x="500" y="273" fill="#8499b3" font-size="12.5" text-anchor="middle">Landing · Dashboard · Calendar · Gantt · Reports · Transactions</text>
    <text x="500" y="290" fill="#8499b3" font-size="12.5" text-anchor="middle">Budgets · Debts · Savings · Plans · AI Advisor · Onboarding</text>
    <text x="500" y="313" fill="#8499b3" font-size="12" text-anchor="middle">Tailwind v4 · shadcn/ui · Recharts · Zustand · React Query v5</text>
    <text x="500" y="330" fill="#8499b3" font-size="12" text-anchor="middle">react-virtual · react-hotkeys-hook · driver.js</text>
  </g>

  <g>
    <rect x="240" y="390" width="520" height="150" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2.5"/>
    <text x="500" y="428" fill="#e5ecf5" font-size="17" font-weight="bold" text-anchor="middle">Backend</text>
    <text x="500" y="449" fill="#8499b3" font-size="12" text-anchor="middle">[Container · FastAPI · Python 3.11+]</text>
    <text x="500" y="473" fill="#8499b3" font-size="12.5" text-anchor="middle">Auth · Plans · Transaction search · Budgets · Savings · Debts</text>
    <text x="500" y="490" fill="#8499b3" font-size="12.5" text-anchor="middle">Stripe payments · CSV/PDF reports · Notifications · AI advisor</text>
    <text x="500" y="513" fill="#8499b3" font-size="12" text-anchor="middle">SQLAlchemy 2.0 · Alembic · Pydantic v2</text>
    <text x="500" y="530" fill="#8499b3" font-size="12" text-anchor="middle">WeasyPrint · matplotlib · Jinja2</text>
  </g>

  <g>
    <rect x="300" y="590" width="400" height="90" rx="10" fill="#0e1422" stroke="#59d6a3" stroke-width="2.5"/>
    <text x="500" y="626" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Database</text>
    <text x="500" y="647" fill="#8499b3" font-size="12" text-anchor="middle">[Datastore · SQLite · PostgreSQL · MySQL]</text>
    <text x="500" y="668" fill="#8499b3" font-size="12.5" text-anchor="middle">Selected by DATABASE_URL — no code change between them.</text>
  </g>

  <line x1="500" y1="340" x2="500" y2="384" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="510" y="367" fill="#b6c2d2" font-size="12">REST · JWT cookie</text>

  <line x1="500" y1="540" x2="500" y2="584" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="510" y="567" fill="#b6c2d2" font-size="12">SQLAlchemy</text>
</svg>
