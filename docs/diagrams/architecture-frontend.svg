<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 990" width="1340" height="990" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Aegis frontend — component view (C4 Level 3)</title>
  <desc id="d">The root layout mounts the backdrop once and renders route pages; pages compose the widget, ui, shell, chart and feature component families, and everything reaches data and state through the lib, hooks and stores layer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a7488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1340" height="990" fill="#050810"/>
  <text x="40" y="52" fill="#e5ecf5" font-size="22" font-weight="bold">Aegis frontend — components</text>
  <text x="40" y="76" fill="#8499b3" font-size="13">C4 Level 3 · one composition tree; every leaf reaches state through the same layer</text>

  <rect x="240" y="150" width="1060" height="790" rx="14" fill="none" stroke="#5ad8ff" stroke-width="1.6" stroke-dasharray="8 6" opacity="0.55"/>
  <text x="256" y="174" fill="#5ad8ff" font-size="12.5" opacity="0.85">Frontend — Next.js 15 App Router [container boundary]</text>

  <!-- Root layout -->
  <g>
    <rect x="560" y="200" width="280" height="100" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2.5"/>
    <text x="700" y="236" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Root layout</text>
    <text x="700" y="257" fill="#8499b3" font-size="12" text-anchor="middle">[app/layout.tsx]</text>
    <text x="700" y="281" fill="#8499b3" font-size="12.5" text-anchor="middle">Providers · Sidebar · Notifications</text>
  </g>

  <!-- Backdrop -->
  <g>
    <rect x="290" y="360" width="250" height="120" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="415" y="396" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Backdrop</text>
    <text x="415" y="417" fill="#8499b3" font-size="12" text-anchor="middle">[shell/backdrop.tsx]</text>
    <text x="415" y="441" fill="#8499b3" font-size="12.5" text-anchor="middle">Cosmic layers on</text>
    <text x="415" y="458" fill="#8499b3" font-size="12.5" text-anchor="middle">marketing routes only —</text>
    <text x="415" y="475" fill="#5ad8ff" font-size="12.5" text-anchor="middle">body.route-app kills the glow.</text>
  </g>

  <!-- Route pages -->
  <g>
    <rect x="620" y="360" width="360" height="140" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2.5"/>
    <text x="800" y="396" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">Route pages</text>
    <text x="800" y="417" fill="#8499b3" font-size="12" text-anchor="middle">[app/{route}/page.tsx]</text>
    <text x="800" y="441" fill="#8499b3" font-size="12.5" text-anchor="middle">welcome · login · register · dashboard</text>
    <text x="800" y="458" fill="#8499b3" font-size="12.5" text-anchor="middle">transactions · budgets · savings · debts</text>
    <text x="800" y="475" fill="#8499b3" font-size="12.5" text-anchor="middle">plans · calendar · gantt · trips · reports</text>
    <text x="800" y="492" fill="#5ad8ff" font-size="12" text-anchor="middle">/payments still routes, but is hidden from nav.</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="270" y="580" width="180" height="140" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="360" y="616" fill="#e5ecf5" font-size="15" font-weight="bold" text-anchor="middle">ui/</text>
    <text x="360" y="637" fill="#8499b3" font-size="12" text-anchor="middle">[shadcn/ui + custom]</text>
    <text x="360" y="661" fill="#8499b3" font-size="12.5" text-anchor="middle">button · dialog</text>
    <text x="360" y="678" fill="#8499b3" font-size="12.5" text-anchor="middle">table · sidebar with</text>
    <text x="360" y="695" fill="#8499b3" font-size="12.5" text-anchor="middle">collapsible clusters</text>
  </g>

  <g>
    <rect x="466" y="580" width="180" height="140" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="556" y="616" fill="#e5ecf5" font-size="15" font-weight="bold" text-anchor="middle">shell/</text>
    <text x="556" y="637" fill="#8499b3" font-size="12" text-anchor="middle">[Themed wrappers]</text>
    <text x="556" y="661" fill="#8499b3" font-size="12.5" text-anchor="middle">kpi · galaxy-card</text>
    <text x="556" y="678" fill="#8499b3" font-size="12.5" text-anchor="middle">sparkline</text>
    <text x="556" y="695" fill="#8499b3" font-size="12.5" text-anchor="middle">black-hole</text>
  </g>

  <g>
    <rect x="662" y="580" width="180" height="140" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="752" y="616" fill="#e5ecf5" font-size="15" font-weight="bold" text-anchor="middle">charts/</text>
    <text x="752" y="637" fill="#8499b3" font-size="12" text-anchor="middle">[Recharts wrappers]</text>
    <text x="752" y="661" fill="#8499b3" font-size="12.5" text-anchor="middle">spending</text>
    <text x="752" y="678" fill="#8499b3" font-size="12.5" text-anchor="middle">cashflow</text>
    <text x="752" y="695" fill="#8499b3" font-size="12.5" text-anchor="middle">trend</text>
  </g>

  <g>
    <rect x="858" y="580" width="180" height="140" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="948" y="616" fill="#e5ecf5" font-size="15" font-weight="bold" text-anchor="middle">Dashboard widgets</text>
    <text x="948" y="637" fill="#8499b3" font-size="12" text-anchor="middle">[dashboard/]</text>
    <text x="948" y="661" fill="#8499b3" font-size="12.5" text-anchor="middle">7 sections drawn</text>
    <text x="948" y="678" fill="#8499b3" font-size="12.5" text-anchor="middle">from a persisted</text>
    <text x="948" y="695" fill="#8499b3" font-size="12.5" text-anchor="middle">order.</text>
  </g>

  <g>
    <rect x="1054" y="580" width="180" height="140" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2"/>
    <text x="1144" y="616" fill="#e5ecf5" font-size="15" font-weight="bold" text-anchor="middle">Feature components</text>
    <text x="1144" y="637" fill="#8499b3" font-size="12" text-anchor="middle">[auth/ ai/ search/]</text>
    <text x="1144" y="661" fill="#8499b3" font-size="12.5" text-anchor="middle">auth-gate · ai-panel</text>
    <text x="1144" y="678" fill="#8499b3" font-size="12.5" text-anchor="middle">command-palette</text>
    <text x="1144" y="695" fill="#8499b3" font-size="12.5" text-anchor="middle">onboarding tour</text>
  </g>

  <!-- lib -->
  <g>
    <rect x="560" y="780" width="400" height="140" rx="10" fill="#0e1422" stroke="#5ad8ff" stroke-width="2.5"/>
    <text x="760" y="816" fill="#e5ecf5" font-size="16" font-weight="bold" text-anchor="middle">lib/ hooks/ stores/</text>
    <text x="760" y="837" fill="#8499b3" font-size="12" text-anchor="middle">[TypeScript]</text>
    <text x="760" y="861" fill="#8499b3" font-size="12.5" text-anchor="middle">api.ts fetch client · utils · animations · use-toast</text>
    <text x="760" y="878" fill="#8499b3" font-size="12.5" text-anchor="middle">auth / app / notification Zustand stores</text>
    <text x="760" y="900" fill="#5ad8ff" font-size="12.5" text-anchor="middle">The app store persists theme, cluster collapse and widget order.</text>
  </g>

  <!-- Edges -->
  <line x1="620" y1="300" x2="450" y2="354" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="486" y="316" fill="#b6c2d2" font-size="12" text-anchor="end">mounts once</text>

  <line x1="780" y1="300" x2="800" y2="354" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="806" y="330" fill="#b6c2d2" font-size="12">renders</text>

  <line x1="690" y1="500" x2="390" y2="574" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="730" y1="500" x2="570" y2="574" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="780" y1="500" x2="757" y2="574" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="860" y1="500" x2="940" y2="574" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="920" y1="500" x2="1120" y2="574" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="800" y="545" fill="#b6c2d2" font-size="12" text-anchor="middle">composes</text>

  <line x1="930" y1="720" x2="880" y2="774" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1120" y1="720" x2="968" y2="800" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>

  <polyline points="980,440 1285,440 1285,850 966,850" fill="none" stroke="#6a7488" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1275" y="430" fill="#b6c2d2" font-size="12" text-anchor="end">fetches + state via</text>
</svg>
